crop_height = 768
crop_quality = 85
fov_min_deg = 60             # 크롭 시야각 범위 (BR-4.2)
fov_max_deg = 100
pitch_max_deg = 40           # 크롭 위쪽 각도 상한 (BR-4.3)
camera_height_m = 2.5        # 거리뷰 카메라 높이 가정 (BR-4.3)
floor_height_m = 3.4         # 층수 -> 높이 환산 (BR-4.3)
