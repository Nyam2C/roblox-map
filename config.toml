# 조정값. 비밀값은 여기에 두지 않는다(.env에만 둔다).
h3_res = 9
overlap_threshold = 0.5      # 두 외곽선을 같은 건물로 보는 겹침 비율 (BR-4.2)
buffer_m = 150               # 칸 경계 밖으로 넓혀 받는 거리(m) (BR-4.9). 가장 큰 건물보다 커야 한다
overpass_pause_s = 1         # Overpass 호출 사이 대기(초)
vworld_pause_s = 0.5         # V-World 호출 사이 대기(초)
vworld_page_size = 1000      # V-World 한 번에 받는 건수 (최대 1000)
retry_waits_s = [10, 30, 60] # 429/502/504/시간 초과일 때 재시도 대기(초)
regions_dir = "regions"     # 구역 설정 regions/<구역>/region.toml과 칸별 판단 파일 cells/<칸>/*.json (git 포함, U7)
db_path = "data/map.db"
log_dir = "data/logs"
backup_dir = "data/backups"
backup_keep = 5

# U3 거리뷰 캡처
captures_dir = "captures"    # 사진 폴더(git 제외). 사람 얼굴과 번호판이 찍힐 수 있다
pano_limit_m = 120           # 건물 중심점에서 이 거리 안의 파노라마만 쓴다 (BR-2.2)
pano_separation_deg = 60     # 고른 파노라마끼리 방위각 차이가 이 값 이상이어야 한다 (BR-2.4)
pano_max_views = 3           # 건물 하나에 쓰는 파노라마 최대 장수
pano_pause_s = 1             # 네이버 호출 사이 최소 대기(초). 더 줄이지 않는다 (BR-3.3)
max_new_panos = 100          # 한 실행에서 새로 내려받는 파노라마 상한 (BR-3.4)
crop_width = 1024            # 건물 크롭 크기와 JPEG 품질 (BR-4.4)
crop_height = 768
crop_quality = 85
fov_min_deg = 60             # 크롭 시야각 범위 (BR-4.2)
fov_max_deg = 100
pitch_max_deg = 40           # 크롭 위쪽 각도 상한 (BR-4.3)
camera_height_m = 2.5        # 거리뷰 카메라 높이 가정 (BR-4.3)
floor_height_m = 3.4         # 층수 -> 높이 환산 (BR-4.3)
default_height_m = 10        # 층수도 높이도 없을 때 (BR-4.3)
school_max_views = 6          # 학교 건물 하나에 쓰는 사진 최대 장수(면마다 하나) (BR-2.7)
school_face_min_m = 8         # 이보다 짧은 면은 사진을 따로 고르지 않는다 (BR-2.7)
school_face_max_deg = 60      # 면의 바깥 방향에서 이 각도 안에 있는 파노라마만 쓴다 (BR-2.7)

# U2 Studio 생성기
origin_lat = 37.504169        # Studio (0, 0, 0): 심원고 세 칸이 만나는 꼭짓점. 프로젝트에 하나, 바꾸지 않는다 (BR-1.1)
origin_lon = 126.779628
studs_per_m = 3.6             # 1 m당 stud. 첫 칸을 만든 뒤 사용자와 같이 보고 확정한다 (FR-10)
poor_fit_ratio = 0.8          # 박스와 면적 비율이 이 값 미만인 건물은 manifest의 poor_fit 목록에 올린다 (BR-2.5)
ground_margin_m = 20          # 땅 판이 칸 경계 밖으로 더 덮는 거리(m) (BR-4.1)
sidewalk_width_m = 1.5        # 인도 폭(m) (BR-3.8)
lane_width_m = 3.25           # 차로 하나의 폭(m). OSM lanes 태그가 있으면 차로 수 x 이 폭 (위성 비교 2026-10-13)
chunk_size = 70               # 한 번의 execute_luau에 넣는 항목 수 (U2 BR-7.2, U5 BR-14.6: 호출당 약 11 KB)

# U4 판단·보정
floor_height_min_m = 2.5      # 대장 높이는 층당 이 범위 안일 때만 쓴다 (BR-4.1)
floor_height_max_m = 5.0
review_batch_size = 12        # 비교 쌍을 한 번에 같이 보는 개수 (BR-7.2)
sheet_tile_w = 512            # 눈가림 묶음 이미지의 칸 크기와 JPEG 품질 (BR-1.4)
sheet_tile_h = 384
sheet_jpeg_quality = 85
blind_broken = ["gis:11081057"]  # 판단 전에 사진과 높이를 본 건물. 사진-대장 일치율에서 뺀다 (N-U4-9)

# U5 디테일 (BR-14.9). 건축 치수(창, 띠, 기단, 대문, 간판 ...)는 src/details_rules.py의 DIMS 상수다
pole_spacing_m = 30           # 전봇대 간격(m), 0이면 없음
lamp_spacing_m = 30           # 가로등 간격(m)
tree_spacing_m = 7            # 가로수 간격(m)
car_spacing_m = 0             # 주차 차량 간격(m, living_street; residential은 x1.25). 0이면 없음. 상자 두 개짜리 차가 어색해서 껐다(2026-10-13)
school_zone_m = 50            # 학교 필지에서 이 거리 안이 스쿨존
roof_pitch_deg = 25           # 박공·모임지붕 경사각
interiors = false              # U7 내부는 취소(사용자 결정 2026-10-14: 외관 품질에 집중). false = U5 맵과 같은 항목
window_faces = "all"          # "front"이면 창을 도로 쪽 면에만 (FPS 조절 1단계)

# U5 간판 이미지 (aidlc-docs/construction/u5-details/sign-images/plan.md). 비밀값 OPENAI_API_KEY, OPENAI_BASE_URL은 .env
assets_dir = "assets/signs"               # 만든 이미지 캐시 (git 제외)
sign_image_model = "gpt-image-2.5-sunburst"   # Azure 배포 이름
sign_image_size = "1536x1024"
sign_image_workers = 4                    # generate의 병렬 호출 수

[road_widths_m]               # 도로 종류별 폭(m). OSM width 태그가 있으면 그것이 우선이다 (BR-3.4)
motorway = 14
trunk = 14
primary = 12
secondary = 11
tertiary = 10
unclassified = 6
residential = 6
service = 4
living_street = 5
road = 6
link = 6                      # 모든 *_link
pedestrian = 2.5
footway = 2
path = 2
cycleway = 2
steps = 2
corridor = 2
bridleway = 2
track = 3

[wall_colors]                 # 벽 색 이름 -> [r, g, b]. 이 이름만 판단·보정에 쓸 수 있다 (기능 설계 Palette)
white = [236, 236, 232]
cream = [236, 224, 190]
beige = [214, 192, 156]
yellow = [232, 205, 110]
orange = [214, 140, 80]
red_brick = [170, 90, 70]
brown = [125, 92, 70]
pink = [225, 170, 170]
light_gray = [200, 200, 205]
dark_gray = [110, 112, 118]
green = [120, 150, 110]
blue = [110, 140, 180]
